<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DALYA BET | Mobil Test</title><style>
:root{font-family:Arial,sans-serif;color:#f7f7f7;background:#090909}*{box-sizing:border-box}body{margin:0}header{padding:22px;background:#211b07;border-bottom:2px solid #ffd400}h1{margin:0;color:#ffd400}main{max-width:900px;margin:auto;padding:16px}.note{padding:14px;border:1px solid #a58b29;background:#2a220b;border-radius:12px;line-height:1.5}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button,.odd,.action{border:1px solid #555;border-radius:9px;background:#242424;color:#fff;padding:12px;font-weight:bold;cursor:pointer}.tabs button.active,.odd.active,.action{background:#ffd400;color:#111}input{background:#171717;color:#fff;border:1px solid #777;border-radius:9px;padding:14px;width:100%;font-size:16px}.match{margin:12px 0;padding:14px;border:1px solid #444;border-radius:12px;background:#181818}.match p{font-weight:bold}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.odd small{display:block;margin-bottom:5px}.coupon{border:1px solid #806b1c;padding:16px;border-radius:12px;margin:20px 0 85px}#quick{position:fixed;bottom:15px;right:15px;border:0;border-radius:30px;padding:16px;background:#ffd400;color:#111;font-weight:bold;box-shadow:0 5px 18px #000a}.muted{color:#bbb;font-size:13px}</style></head><body><header><h1>♛ DALYA BET</h1><div>Mobil kullanım testi</div></header><main><div class="note"><b>TEST ORTAMI</b> — Buradaki maçlar ve oranlar örnektir. Gerçek veri, üyelik, bakiye veya kupon kaydı kullanılmaz.</div><div class="tabs"><button class="active" data-tab="all">Tüm maçlar</button><button data-tab="turkey">🇹🇷 Türkiye</button></div><input id="search" type="search" placeholder="🔎 Takım veya lig ara" aria-label="Takım veya lig ara"><div id="matches"></div><section class="coupon" id="coupon"><h2>🎟️ Kuponum</h2><div id="choices" class="muted">Oran seçerek başlayın.</div><p>Toplam oran: <strong id="total">1.00</strong></p><label>Sanal test puanı<input id="stake" type="number" min="1" value="100"></label><p>Olası test puanı: <strong id="win">100.00</strong></p><button class="action" id="clear">Kuponu temizle</button><p class="muted">Bu sayfa kupon göndermez ve bakiye değiştirmez.</p></section></main><button id="quick">🎟️ Kuponum (0)</button><script>
const games=[{id:1,league:'Türkiye Süper Lig',home:'Örnek İstanbul',away:'Örnek Ankara',odds:[1.85,3.30,4.20],turkey:true},{id:2,league:'Türkiye 1. Lig',home:'Örnek İzmir',away:'Örnek Bursa',odds:[2.10,3.10,3.45],turkey:true},{id:3,league:'Örnek Avrupa Ligi',home:'Örnek A',away:'Örnek B',odds:[1.70,3.60,4.60],turkey:false}];const $=x=>document.getElementById(x);let tab='all',picked=new Map();function render(){const q=$('search').value.toLocaleLowerCase('tr-TR');$('matches').replaceChildren();for(const g of games.filter(x=>(tab==='all'||x.turkey)&&[x.league,x.home,x.away].some(y=>y.toLocaleLowerCase('tr-TR').includes(q)))){const card=document.createElement('div');card.className='match';const p=document.createElement('p');p.textContent=g.home+' – '+g.away;const sub=document.createElement('div');sub.className='muted';sub.textContent=g.league+' · ÖRNEK MAÇ';const odds=document.createElement('div');odds.className='odds';g.odds.forEach((v,i)=>{const b=document.createElement('button');b.className='odd'+(picked.get(g.id)===i?' active':'');b.textContent=['1','X','2'][i]+'  '+v.toFixed(2);b.onclick=()=>{if(picked.get(g.id)===i)picked.delete(g.id);else picked.set(g.id,i);render()};odds.append(b)});card.append(sub,p,odds);$('matches').append(card)}if(!$('matches').children.length)$('matches').textContent='Eşleşen maç bulunamadı.';const selected=games.filter(g=>picked.has(g.id));const total=selected.reduce((v,g)=>v*g.odds[picked.get(g.id)],1);$('choices').textContent=selected.length?selected.map(g=>g.home+' – '+g.away+' / '+['1','X','2'][picked.get(g.id)]).join(' | '):'Oran seçerek başlayın.';$('total').textContent=total.toFixed(2);$('win').textContent=(total*Math.max(0,Number($('stake').value)||0)).toFixed(2);$('quick').textContent='🎟️ Kuponum ('+selected.length+')'}$('search').oninput=render;$('stake').oninput=render;$('clear').onclick=()=>{picked.clear();render()};$('quick').onclick=()=>$('coupon').scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
