<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DALYA BET | Canlı Tombala Test Salonu</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1014;color:#f6f0df;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:22px}h1{color:#f4ca55}section{background:#1b2229;border:1px solid #66552b;border-radius:16px;padding:20px;margin:15px 0}.muted{color:#b6b6b6}.card{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}.cell{aspect-ratio:1;display:grid;place-items:center;background:#293744;border-radius:6px;font-weight:bold}.blank{background:#111820}.hit{background:#347e55}button{background:#e9bd49;color:#161616;border:0;border-radius:9px;padding:14px 20px;font-weight:800;font-size:16px}button:disabled{opacity:.4}a{color:#f4ca55}.balls{display:flex;gap:6px;flex-wrap:wrap}.ball{background:#e9bd49;color:#111;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:bold}</style></head><body><header><h1>♛ DALYA BET • TOMBALA</h1><p class="muted">Canlı çok oyunculu salon • Test aşaması • Yalnızca sanal puan</p><a href="./casino.html">← Casino'ya dön</a></header><main><section><h2>Salon durumu</h2><p id="status">Bağlanıyor…</p><p id="room"></p><p id="count"></p><button id="join" disabled>Ücretsiz test kartı al</button><p class="muted">Test kartı puan düşürmez. Gerçek oyun ve %70 kasa / %30 ödül dağıtımı henüz etkin değildir.</p></section><section><h2>Kartım</h2><div id="card" class="card"></div></section><section><h2>Çekilen toplar</h2><div id="balls" class="balls">Çekiliş başlamadı.</div></section></main><script type="module">
const $=id=>document.getElementById(id);const url='https://tqgtctbutprvjklyxmgn.supabase.co',key='sb_publishable_3NamNe0qiMsFTliKw2Kl4g_qBZ4wdVP';
let client,room,user,card;const show=s=>$('status').textContent=s;
function render(){if(!room)return;$('room').textContent='Salon #'+room.id+' • '+({waiting:'Oyuncu bekleniyor',playing:'Oyun devam ediyor',finished:'Oyun bitti'}[room.state]||room.state);$('join').disabled=!user||room.state!=='waiting'||!!card;const drawn=room.drawn||[];$('balls').replaceChildren(...drawn.map(n=>{let e=document.createElement('span');e.className='ball';e.textContent=n;return e}));if(!drawn.length)$('balls').textContent='Çekiliş başlamadı.';if(card){$('card').replaceChildren(...card.flat().map(n=>{let e=document.createElement('div');e.className='cell'+(n===null?' blank':drawn.includes(n)?' hit':'');e.textContent=n??'';return e}))}}
async function refresh(){const {data,error}=await client.from('dalya_tombala_rooms').select('*').order('id',{ascending:false}).limit(1).maybeSingle();if(error)throw error;room=data;const cards=await client.from('dalya_tombala_cards').select('cells').eq('room_id',room.id).eq('user_id',user.id).maybeSingle();if(cards.error)throw cards.error;card=cards.data?.cells||null;show('Üye girişi doğrulandı. Test salonu hazır.');render()}
try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');client=createClient(url,key);const auth=await client.auth.getUser();if(auth.error||!auth.data.user){show('Önce DALYA BET üye girişi yapın.');$('room').textContent='Bu sayfa yalnızca giriş yapmış üyeler içindir.';}else{user=auth.data.user;await refresh();$('join').onclick=async()=>{try{$('join').disabled=true;const r=await client.rpc('dalya_tombala_join',{p_room:room.id});if(r.error)throw r.error;card=r.data;show('Test kartınız oluşturuldu.');render()}catch(e){show('Kart alınamadı: '+e.message);render()}};setInterval(()=>refresh().catch(e=>show('Güncelleme hatası: '+e.message)),5000)}}catch(e){show('Bağlantı hatası: '+e.message)}
</script></body></html>
