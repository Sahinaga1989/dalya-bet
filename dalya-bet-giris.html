<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DALYA BET | Üye Girişi</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#eee;font:16px Arial,sans-serif}.wrap{max-width:460px;margin:9vh auto;padding:24px}.brand{color:#ffd400;font-size:42px;font-weight:900;font-style:italic;text-align:center}.brand span{color:#fff}.card{background:#181818;border:1px solid #65500a;border-radius:18px;padding:24px;margin-top:25px}h1{font-size:23px}label{display:block;margin:18px 0 7px}input{width:100%;padding:14px;border-radius:8px;border:1px solid #555;background:#090909;color:#fff;font-size:16px}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:9px;background:#ffd400;color:#111;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#msg{min-height:25px;color:#ffcf70;line-height:1.4}small{color:#aaa}a{color:#ffd400}</style></head><body><div class="wrap"><div class="brand">♛ DALYA <span>BET</span></div><section class="card" id="login"><h1>Üye Girişi</h1><p>Yalnızca yönetici tarafından oluşturulan hesaplar giriş yapabilir.</p><form id="form"><label for="email">E-posta</label><input id="email" type="email" autocomplete="username" required><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Giriş Yap</button></form><p id="msg" role="status"></p><small>Yeni üyelik başvurusu bu sayfada kapalıdır.</small></section><section class="card" id="account" hidden><h1>Hoş geldiniz</h1><p id="who"></p><a href="./index.html">Maç merkezine git</a><button id="logout">Çıkış Yap</button></section></div><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const client=createClient('https://tqgtctbutprvjklyxmgn.supabase.co','sb_publishable_3NamNe0qiMsFTliKw2Kl4g_qBZ4wdVP');const $=id=>document.getElementById(id);function display(user){$('login').hidden=!!user;$('account').hidden=!user;if(user)$('who').textContent=user.email||'Üye';}const {data:{session}}=await client.auth.getSession();display(session?.user);client.auth.onAuthStateChange((_event,session)=>display(session?.user));$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='Giriş kontrol ediliyor…';try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('msg').textContent=error?'Giriş başarısız. E-posta ve şifreyi kontrol edin.':'';}catch(e){$('msg').textContent='Bağlantı hatası. Tekrar deneyin.';}finally{$('submit').disabled=false;}});$('logout').onclick=async()=>{await client.auth.signOut();};</script></body></html>
