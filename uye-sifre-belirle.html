<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DALYA BET | Şifre Belirle</title><style>body{background:#090909;color:#eee;font:16px Arial,sans-serif;margin:0}.wrap{max-width:450px;margin:9vh auto;padding:22px}.brand{color:#ffd400;font-size:32px;font-weight:900}.card{background:#191919;border:1px solid #6a520a;border-radius:15px;padding:22px;margin-top:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;font-size:16px}input{background:#111;color:#fff;border:1px solid #666}button{background:#ffd400;color:#111;border:0;font-weight:bold}button:disabled{opacity:.5}a{color:#ffd400}#msg{line-height:1.5}</style></head><body><main class="wrap"><div class="brand">♛ DALYA BET</div><section class="card"><h1>Üyelik Şifresi Belirle</h1><p id="msg">Davet bağlantısı kontrol ediliyor…</p><form id="form" hidden><label for="pass">Yeni şifre (en az 12 karakter)</label><input id="pass" type="password" minlength="12" autocomplete="new-password" required><label for="again">Şifreyi tekrar yaz</label><input id="again" type="password" minlength="12" autocomplete="new-password" required><button id="save" type="submit">Şifremi Kaydet</button></form><p><a href="./dalya-bet-giris.html">Üye girişine dön</a></p></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://tqgtctbutprvjklyxmgn.supabase.co','sb_publishable_3NamNe0qiMsFTliKw2Kl4g_qBZ4wdVP');const $=id=>document.getElementById(id);let valid=false;const params=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));try{if(params.get('token_hash')&&params.get('type')==='invite'){const {error}=await db.auth.verifyOtp({token_hash:params.get('token_hash'),type:'invite'});if(error)throw error;}else if(params.get('code')){const {error}=await db.auth.exchangeCodeForSession(params.get('code'));if(error)throw error;}const {data:{user},error}=await db.auth.getUser();if(error||!user)throw new Error('no session');valid=true;$('form').hidden=false;$('msg').textContent='Davet doğrulandı. Şimdi kendi şifreni belirle.';history.replaceState(null,'',location.pathname);}catch(e){$('msg').textContent='Davet bağlantısı geçersiz veya süresi dolmuş. Yöneticiden yeni davet isteyin.';}$('form').onsubmit=async e=>{e.preventDefault();if(!valid)return;const pass=$('pass').value;if(pass.length<12||pass!==$('again').value){$('msg').textContent='Şifreler aynı olmalı ve en az 12 karakter içermeli.';return;}$('save').disabled=true;try{const {error}=await db.auth.updateUser({password:pass});if(error)throw error;$('msg').textContent='Şifren kaydedildi. Artık giriş yapabilirsin.';$('form').hidden=true;await db.auth.signOut();}catch(e){$('msg').textContent='Şifre kaydedilemedi. Tekrar dene.';}finally{$('save').disabled=false;}};</script></body></html>
