name: DALYA BET Dunya Maclari

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: dalya-live-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Turkiye kupasi oncelikli dunya maclarini guncelle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo

          KEY = (os.getenv('API_FOOTBALL_KEY') or os.getenv('API_KEY') or '').strip()
          if not KEY:
              raise SystemExit('API_FOOTBALL_KEY veya API_KEY GitHub secret eksik')
          BASE = 'https://v3.football.api-sports.io/'
          MAX_RUN = 48
          MAX_DAILY = 1500  # This workflow only; keep quota for other API consumers
          MAX_MATCHES = 1000
          RETRY_HOURS = 4
          CUP_ID = 206
          now = dt.datetime.now(dt.timezone.utc)
          today = now.astimezone(ZoneInfo('Europe/Istanbul')).date()
          dates = [(today + dt.timedelta(days=i)).isoformat() for i in (-2, -1, 0, 1)]  # Refresh last 2 days for coupon settlement, plus today and tomorrow
          # Refresh two more days per run, rotating across a 30-day horizon.
          rotation = (int(now.timestamp()) // 3600) % 14
          dates += [(today + dt.timedelta(days=2 + (rotation * 2 + j) % 28)).isoformat() for j in range(2)]
          stamp = now.isoformat()
          day_key = today.isoformat()

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          def save(path, data):
              target = Path(path)
              temp = target.with_suffix(target.suffix + '.tmp')
              temp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
              temp.replace(target)

          state = load('odds-progress.json', {})
          # Track only this workflow's calls. Other API consumers are not counted.
          budget = load('dalya-api-budget.json', {})
          if not isinstance(budget, dict) or budget.get('date') != day_key:
              budget = {'date': day_key, 'requests': 0}
          if not isinstance(state, dict) or state.get('date') != day_key:
              state = {'date': day_key, 'requests': 0, 'last_attempt': state.get('last_attempt', {}) if isinstance(state, dict) else {}}
          attempts = state.get('last_attempt', {})
          if not isinstance(attempts, dict):
              attempts = {}
          try:
              daily = max(0, int(budget.get('requests', 0)))
          except (TypeError, ValueError):
              daily = 0
          calls = 0

          def fetch(endpoint, params):
              global daily, calls
              if calls >= MAX_RUN or daily >= MAX_DAILY:
                  raise RuntimeError('Yerel istek limiti doldu')
              calls += 1
              daily += 1  # Basarisiz istekler de sayilir
              url = BASE + endpoint + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  'x-apisports-key': KEY, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      payload = json.load(res)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('API HTTP status ' + str(exc.code)) from exc
              if not isinstance(payload, dict):
                  raise RuntimeError('API JSON object bekleniyordu')
              if payload.get('errors'):
                  raise RuntimeError('API hatasi: ' + str(payload['errors'])[:180])
              if not isinstance(payload.get('response'), list):
                  raise RuntimeError('API response listesi bulunamadi')
              return payload['response'], payload.get('paging') or {}

          def turkey(match):
              league = match.get('league') or {}
              return str(league.get('country', '')).casefold().strip() in (
                  'turkey', 'türkiye', 'turkiye')

          def is_cup(match):
              league = match.get('league') or {}
              name = str(league.get('name', '')).casefold()
              return str(league.get('id', '')) == str(CUP_ID) or (
                  'cup' in name and any(x in name for x in ('turkey', 'türkiye', 'turkiye')))

          def local_date(match):
              try:
                  raw = match['fixture']['date'].replace('Z', '+00:00')
                  return dt.datetime.fromisoformat(raw).astimezone(
                      ZoneInfo('Europe/Istanbul')).date().isoformat()
              except (KeyError, TypeError, ValueError, AttributeError):
                  return ''

          def fixture_id(match):
              value = (match.get('fixture') or {}).get('id')
              return str(value) if value is not None else ''

          def valid_odd(value):
              return isinstance(value, dict) and all(value.get(k) for k in ('1', 'X', '2'))

          TURKISH_BOOKMAKERS = ('iddaa', 'nesine', 'misli', 'bilyoner')
          def bookmaker_priority(name, prefer_turkish):
              label = str(name or '').casefold()
              return 0 if prefer_turkish and any(x in label for x in TURKISH_BOOKMAKERS) else 1

          def extract_odds(events, prefer_turkish_ids=None):
              prefer_turkish_ids = prefer_turkish_ids or set()
              result = {}
              for event in events:
                  ident = str((event.get('fixture') or {}).get('id', ''))
                  for bookmaker in sorted(event.get('bookmakers') or [], key=lambda b: bookmaker_priority(b.get('name'), ident in prefer_turkish_ids)):
                      for bet in bookmaker.get('bets') or []:
                          if str(bet.get('id')) != '1' and str(bet.get('name', '')).casefold() != 'match winner':
                              continue
                          values = {str(v.get('value', '')).strip().casefold(): v.get('odd')
                                    for v in bet.get('values') or []}
                          if all(values.get(k) for k in ('home', 'draw', 'away')):
                              result[ident] = {
                                  '1': str(values['home']), 'X': str(values['draw']),
                                  '2': str(values['away']), 'bookmaker': bookmaker.get('name', '')}
                              break
                      if ident in result:
                          break
              return result

          old_scores = load('scores.json', load('matches.json', {}))
          old_odds_data = load('odds.json', {})
          old_odds = old_odds_data.get('matches', {}) if isinstance(old_odds_data, dict) else {}
          if not isinstance(old_odds, dict):
              old_odds = {}
          if daily >= MAX_DAILY:
              raise SystemExit('Gunluk yerel API limiti dolu; yeni veri cekilmedi')
          try:
              # All countries, with Turkey Cup and Turkish leagues prioritized.
              # Only competitions provided by the API can be included.
              matches = []
              # Preserve future fixtures until their next rotating refresh.
              if isinstance(old_scores, dict):
                  matches.extend(m for m in old_scores.get('response', [])
                                 if isinstance(m, dict) and (today - dt.timedelta(days=2)).isoformat() <= local_date(m)
                                 <= (today + dt.timedelta(days=29)).isoformat()
                                 and local_date(m) not in dates)
              for day in dates:
                  response, _ = fetch('fixtures', {'date': day, 'timezone': 'Europe/Istanbul'})
                  current = [m for m in response if local_date(m) == day]
                  if not current:
                      print('UYARI: Tarihte mac yok:', day)
                  matches.extend(current)
              unique = {}
              for match in matches:
                  ident = fixture_id(match)
                  if ident:
                      unique[ident] = match
              # Keep all available fixtures within the rolling horizon, without a 250-match truncation.
              fixtures = sorted(unique.values(), key=lambda m: (
                  (m.get('fixture') or {}).get('date') or '',
                  0 if is_cup(m) else (1 if turkey(m) else 2), fixture_id(m)))
              ids = [fixture_id(m) for m in fixtures]
              scheduled = {fixture_id(m): m for m in fixtures}
              # Cup first, then missing odds, then refresh existing odds.
              ids.sort(key=lambda ident: (
                  0 if is_cup(scheduled[ident]) else (1 if turkey(scheduled[ident]) else 2),
                  0 if ident not in old_odds else 1))
              # Only show previously fetched pre-match odds for fixtures not yet started.
              odds = {ident: old_odds[ident] for ident in ids
                      if ident in old_odds and valid_odd(old_odds[ident])
                      and (scheduled[ident].get('fixture', {}).get('status', {}).get('short') == 'NS')}
              # Fetch odds by date, using the provider's paginated response.
              # This allows more coverage with the same request budget.
              eligible = set(ids)
              turkish_ids = {ident for ident in ids if turkey(scheduled[ident])}
              odds_pages = 0
              odds_errors = []
              for day in dates:
                  page = 1
                  # Spread requests across today, tomorrow and rotating future dates.
                  while page <= 2 and calls < MAX_RUN - 12 and daily < MAX_DAILY:
                      try:
                          events, paging = fetch('odds', {
                              'date': day, 'timezone': 'Europe/Istanbul',
                              'bet': 1, 'page': page})
                      except Exception as exc:
                          print('Toplu oran sorgusu basarisiz:', day, page, str(exc)[:160])
                          odds_errors.append(str(exc)[:160])
                          if any(x in str(exc).casefold() for x in ('limit', 'quota', '429', 'rate')):
                              raise
                          break
                      fresh = extract_odds(events, turkish_ids)
                      for ident, entry in fresh.items():
                          if ident in eligible and scheduled[ident].get('fixture', {}).get('status', {}).get('short') == 'NS':
                              entry['fetched_at'] = stamp
                              odds[ident] = entry
                      odds_pages += 1
                      try:
                          total_pages = int(paging.get('total', 1))
                      except (TypeError, ValueError):
                          total_pages = 1
                      if not events or page >= total_pages:
                          break
                      page += 1
              # Scan every eligible fixture over successive hourly runs, prioritizing Turkey.
              # Persist a cursor so a fixed small subset is not queried repeatedly.
              missing = [ident for ident in ids if ident not in odds
                         and scheduled[ident].get('fixture', {}).get('status', {}).get('short') == 'NS'
                         and today.isoformat() <= local_date(scheduled[ident]) <= (today + dt.timedelta(days=29)).isoformat()]
              # Track each fixture independently: rotating a cursor over a changing list
              # could repeatedly skip some matches and waste requests on others.
              retry_seconds = RETRY_HOURS * 3600
              def last_checked(ident):
                  try:
                      return dt.datetime.fromisoformat(str(attempts.get(ident, '1970-01-01T00:00:00+00:00')).replace('Z', '+00:00')).timestamp()
                  except (ValueError, TypeError, OverflowError):
                      return 0
              eligible_missing = [ident for ident in missing
                                  if now.timestamp() - last_checked(ident) >= retry_seconds]
              eligible_missing.sort(key=lambda ident: (
                  0 if is_cup(scheduled[ident]) else (1 if ident in turkish_ids else 2),
                  local_date(scheduled[ident]),
                  last_checked(ident), ident))
              checked = 0
              for ident in eligible_missing[:max(0, min(len(eligible_missing), MAX_RUN - calls, MAX_DAILY - daily))]:
                  checked += 1
                  attempts[ident] = stamp
                  try:
                      events, _ = fetch('odds', {'fixture': ident, 'bet': 1})
                      fresh = extract_odds(events, turkish_ids)
                      if ident in fresh:
                          fresh[ident]['fetched_at'] = stamp
                          odds[ident] = fresh[ident]
                  except Exception as exc:
                      print('Tek mac oran sorgusu basarisiz:', ident, str(exc)[:120])
                      if any(x in str(exc).casefold() for x in ('limit', 'quota', '429', 'rate')):
                          raise
              # Keep only recent fixture checks so the progress file stays small.
              active_ids = set(missing)
              attempts = {ident: checked_at for ident, checked_at in attempts.items()
                          if ident in active_ids}
              state['last_attempt'] = attempts
              print('Tekil oran taramasi:', checked, 'bekleyen:', len(missing),
                    'yeniden sorgulanabilir:', len(eligible_missing))
              turkey_missing = [ident for ident in turkish_ids if ident not in odds and scheduled[ident].get('fixture', {}).get('status', {}).get('short') == 'NS']
              print('Turkiye oran durumu: bulunan', len(turkish_ids) - len(turkey_missing), 'eksik', len(turkey_missing))
              for ident in sorted(turkey_missing, key=lambda x: local_date(scheduled[x]))[:60]:
                  m = scheduled[ident]
                  print('TR ORAN YOK:', ident, local_date(m), (m.get('league') or {}).get('name'), (m.get('teams') or {}).get('home', {}).get('name'), '-', (m.get('teams') or {}).get('away', {}).get('name'))
              print('Toplu oran sayfalari:', odds_pages)
              if odds_errors:
                  print('UYARI: Toplu oran API hatalari:', '; '.join(odds_errors))
              score_payload = {'updated_at': stamp, 'date': today.isoformat(),
                               'dates': dates, 'horizon_days': 30, 'response': fixtures}
              if not fixtures:
                  raise RuntimeError('Bos fikstur mevcut dosyalarin uzerine yazilmadi')
              save('scores.json', score_payload)
              save('matches.json', score_payload)
              save('odds.json', {'updated_at': stamp, 'matches': odds})
              print('Tum maclar:', len(fixtures), 'Turkiye:', sum(turkey(m) for m in fixtures), 'Turkiye Kupasi:', sum(is_cup(m) for m in fixtures), 'oranli maclar:', len(odds))
              if not fixtures:
                  print('UYARI: Bu tarih araliginda mac bulunamadi')
          except Exception as exc:
              print('Fikstur alinamadi; mevcut dosyalar korundu:', str(exc)[:200])
              # A green GitHub check must not hide an API failure.
              raise
          finally:
              save('dalya-api-budget.json', {'date': day_key, 'requests': daily, 'updated_at': stamp})
              save('odds-progress.json', {'date': day_key, 'requests': state.get('requests', 0),
                                          'odds_cursor': state.get('odds_cursor', 0),
                                          'last_attempt': attempts, 'updated_at': stamp})
              print('Bu calismadaki API istekleri:', calls, 'gunluk sayac:', daily)
          PY
      - name: Degisiklikleri GitHub'a kaydet
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scores.json matches.json odds.json odds-progress.json dalya-api-budget.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DALYA BET world fixtures with Turkey priority'
            for attempt in 1 2 3; do
              git fetch origin main
              git -c rebase.autoStash=false rebase -X theirs origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo 'GitHub push 3 denemede basarisiz oldu' >&2
            exit 1
          fi
