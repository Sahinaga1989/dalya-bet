name: DALYA BET Canli Skorlar

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: dalya-live-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Maclari ve oranlari guncelle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, datetime, time
          from pathlib import Path

          key = os.environ.get('API_FOOTBALL_KEY', '').strip()
          if not key:
              raise SystemExit('API_FOOTBALL_KEY GitHub secret eksik')
          base = 'https://v3.football.api-sports.io/'
          calls = 0
          MAX_CALLS = 40

          def fetch(endpoint):
              global calls
              if calls >= MAX_CALLS:
                  raise RuntimeError('Bu calisma icin API istek sinirina ulasildi')
              req = urllib.request.Request(base + endpoint, headers={'x-apisports-key': key})
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.load(response)
              calls += 1
              if payload.get('errors'):
                  raise RuntimeError(str(payload['errors']))
              return payload.get('response', [])

          today = datetime.datetime.now(datetime.timezone.utc).date()
          fixtures = fetch('fixtures?date=' + today.isoformat())[:250]
          previous = {}
          odds_file = Path('odds.json')
          if odds_file.exists():
              try:
                  previous = json.loads(odds_file.read_text(encoding='utf-8')).get('matches', {})
              except (ValueError, OSError, AttributeError):
                  previous = {}
          odds = {}
          # One odds request per fixture; cap prevents accidental quota exhaustion.
          for match in fixtures:
              fixture_id = match.get('fixture', {}).get('id')
              if fixture_id is None:
                  continue
              ident = str(fixture_id)
              if ident in previous:
                  odds[ident] = previous[ident]
              if calls >= MAX_CALLS:
                  continue
              try:
                  results = fetch('odds?fixture=' + ident + '&bet=1')
                  for event in results:
                      for bookmaker in event.get('bookmakers', []):
                          for bet in bookmaker.get('bets', []):
                              if bet.get('id') != 1:
                                  continue
                              values = {str(v.get('value', '')).lower(): v.get('odd') for v in bet.get('values', [])}
                              home = values.get('home') or values.get('1')
                              draw = values.get('draw') or values.get('x')
                              away = values.get('away') or values.get('2')
                              if home and draw and away:
                                  odds[ident] = {'1': home, 'X': draw, '2': away, 'bookmaker': bookmaker.get('name')}
                                  break
                          if ident in odds and odds[ident].get('bookmaker'):
                              break
                      if ident in odds and odds[ident].get('bookmaker'):
                          break
              except (urllib.error.URLError, TimeoutError, RuntimeError) as error:
                  print('Oran alinamadi:', ident, str(error))
              time.sleep(0.15)

          stamp = datetime.datetime.now(datetime.timezone.utc).isoformat()
          Path('scores.json').write_text(json.dumps({'updated_at': stamp, 'date': today.isoformat(), 'count': len(fixtures), 'response': fixtures}, ensure_ascii=False, indent=2), encoding='utf-8')
          odds_file.write_text(json.dumps({'updated_at': stamp, 'matches': odds}, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Mac:', len(fixtures), 'Oran:', len(odds), 'API istek:', calls)
          PY
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json odds.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DALYA BET football data"
            git push
          fi
