
name: DALYA BET Canli Skorlar

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Futbol verilerini getir
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          from datetime import datetime, timezone

          key = os.environ["API_KEY"]
          url = "https://v3.football.api-sports.io/fixtures?date=" + datetime.now(timezone.utc).strftime("%Y-%m-%d")
          request = urllib.request.Request(
              url, headers={"x-apisports-key": key}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          if data.get("errors"):
              raise RuntimeError(str(data["errors"]))

          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY

      - name: Verileri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Canli futbol verilerini guncelle"
            git push
          fi
