name: DALYA BET Canli Skorlar

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: dalya-live-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Maclari ve oranlari guncelle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BASE = 'https://v3.football.api-sports.io/'
          KEY = os.environ.get('API_FOOTBALL_KEY', '').strip()
          if not KEY:
              raise SystemExit('GitHub secret API_FOOTBALL_KEY bulunamadi')

          # These are safety caps, not proof of the provider's actual plan allowance.
          MAX_DAILY = 6500
          MAX_RUN = 180
          MAX_MATCHES = 250
          # Avoid rechecking matches without odds too frequently.
          RETRY_AFTER_HOURS = 6
          today = dt.datetime.now(dt.timezone.utc).date().isoformat()
          now = dt.datetime.now(dt.timezone.utc)
          stamp = now.isoformat()
          progress_path = Path('odds-progress.json')
          odds_path = Path('odds.json')
          scores_path = Path('scores.json')

          def read_json(path, default):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          def write_json(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          progress = read_json(progress_path, {})
          if not isinstance(progress, dict) or progress.get('date') != today:
              progress = {'date': today, 'requests': 0, 'last_attempt': {}}
          daily = max(0, int(progress.get('requests', 0)))
          last_attempt = progress.get('last_attempt', {})
          if not isinstance(last_attempt, dict):
              last_attempt = {}
          # Migrate previous format: attempted IDs are only retained for this day.
          for ident in progress.get('attempted', []):
              last_attempt.setdefault(str(ident), stamp)
          run_calls = 0

          def fetch(endpoint, params):
              global daily, run_calls
              if daily >= MAX_DAILY or run_calls >= MAX_RUN:
                  raise RuntimeError('Yerel API guvenlik sinirina ulasildi')
              # Count before HTTP attempt to conservatively track usage.
              daily += 1
              run_calls += 1
              query = urllib.parse.urlencode(params)
              req = urllib.request.Request(BASE + endpoint + '?' + query,
                  headers={'x-apisports-key': KEY, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  payload = json.load(resp)
              if payload.get('errors'):
                  raise RuntimeError('API hatasi: ' + str(payload['errors'])[:200])
              return payload.get('response', [])

          old_data = read_json(odds_path, {})
          old_odds = old_data.get('matches', {}) if isinstance(old_data, dict) else {}
          if not isinstance(old_odds, dict):
              old_odds = {}
          fixtures = []
          odds = {}
          try:
              fixtures = fetch('fixtures', {'date': today, 'timezone': 'UTC'})[:MAX_MATCHES]
              ids = [str(m['fixture']['id']) for m in fixtures
                     if isinstance(m, dict) and isinstance(m.get('fixture'), dict)
                     and m['fixture'].get('id') is not None]
              odds = {ident: old_odds[ident] for ident in ids if ident in old_odds
                      and isinstance(old_odds[ident], dict)
                      and all(old_odds[ident].get(k) for k in ('1', 'X', '2'))}
              for ident in ids:
                  if ident in odds:
                      continue
                  attempted_at = last_attempt.get(ident)
                  if attempted_at:
                      try:
                          elapsed = now - dt.datetime.fromisoformat(attempted_at)
                          if elapsed.total_seconds() < RETRY_AFTER_HOURS * 3600:
                              continue
                      except (ValueError, TypeError):
                          pass
                  if daily >= MAX_DAILY or run_calls >= MAX_RUN:
                      break
                  last_attempt[ident] = stamp
                  try:
                      events = fetch('odds', {'fixture': ident})
                      found = None
                      for event in events:
                          for bookmaker in event.get('bookmakers', []):
                              for bet in bookmaker.get('bets', []):
                                  if str(bet.get('id')) != '1' and bet.get('name') != 'Match Winner':
                                      continue
                                  values = {str(v.get('value', '')).strip().lower(): v.get('odd')
                                            for v in bet.get('values', [])}
                                  home, draw, away = values.get('home'), values.get('draw'), values.get('away')
                                  if home and draw and away:
                                      found = {'1': str(home), 'X': str(draw), '2': str(away),
                                               'bookmaker': bookmaker.get('name', '')}
                                      break
                              if found:
                                  break
                          if found:
                              break
                      if found:
                          odds[ident] = found
                  except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                      print('Oran sorgusu gecici hata:', ident, str(exc)[:120])
                      last_attempt.pop(ident, None)
                  except RuntimeError as exc:
                      print('API sorgusu durduruldu:', str(exc)[:200])
                      break
                  time.sleep(0.12)
              write_json(scores_path, {'updated_at': stamp, 'date': today, 'response': fixtures})
              write_json(odds_path, {'updated_at': stamp, 'matches': odds})
              print('Mac:', len(fixtures), 'Oran:', len(odds), 'Eksik:', max(0, len(ids) - len(odds)))
          finally:
              write_json(progress_path, {'date': today, 'requests': daily,
                  'last_attempt': last_attempt, 'updated_at': stamp})
              print('Bu calismadaki API istegi:', run_calls, 'Gunluk kaydedilen:', daily)
          PY
      - name: Degisiklikleri kaydet
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scores.json odds.json odds-progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DALYA BET football data'
            git push
          fi
