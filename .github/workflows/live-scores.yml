name: DALYA BET Canli Skorlar

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: dalya-live-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Maclari ve oranlari guncelle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BASE = 'https://v3.football.api-sports.io/'
          KEY = os.environ.get('API_FOOTBALL_KEY', '').strip()
          if not KEY:
              raise SystemExit('GitHub secret API_FOOTBALL_KEY bulunamadi')
          MAX_DAILY = 6500  # 7500 saglayici limitinin altinda guvenlik payi
          MAX_RUN = 280    # 250 maca kadar odds + fikstur istegi
          MAX_MATCHES = 250
          today = dt.datetime.now(dt.timezone.utc).date().isoformat()
          progress_path = Path('odds-progress.json')
          odds_path = Path('odds.json')
          scores_path = Path('scores.json')

          def read_json(path, default):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          def write_json(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          progress = read_json(progress_path, {})
          if progress.get('date') != today:
              progress = {'date': today, 'requests': 0, 'attempted': []}
          daily = max(0, int(progress.get('requests', 0)))
          attempted = set(map(str, progress.get('attempted', [])))
          run_calls = 0
          stamp = dt.datetime.now(dt.timezone.utc).isoformat()

          def fetch(endpoint, params):
              global daily, run_calls
              if daily >= MAX_DAILY or run_calls >= MAX_RUN:
                  raise RuntimeError('API guvenlik sinirina ulasildi')
              # Sayaci HTTP isteginden once arttir; hatali istekleri de say.
              daily += 1
              run_calls += 1
              url = BASE + endpoint + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'x-apisports-key': KEY})
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('errors'):
                  raise RuntimeError(str(payload['errors']))
              return payload.get('response', [])

          old_odds = read_json(odds_path, {}).get('matches', {})
          if not isinstance(old_odds, dict):
              old_odds = {}
          fixtures = []
          try:
              fixtures = fetch('fixtures', {'date': today, 'timezone': 'UTC'})[:MAX_MATCHES]
              ids = [str(m['fixture']['id']) for m in fixtures if isinstance(m, dict) and m.get('fixture', {}).get('id')]
              # Eski oranlari yalnizca halen listelenen maclar icin tut.
              odds = {ident: old_odds[ident] for ident in ids if ident in old_odds}
              for ident in ids:
                  if ident in odds or ident in attempted:
                      continue
                  if daily >= MAX_DAILY or run_calls >= MAX_RUN:
                      break
                  attempted.add(ident)
                  try:
                      events = fetch('odds', {'fixture': ident})
                      found = None
                      for event in events:
                          for bookmaker in event.get('bookmakers', []):
                              for bet in bookmaker.get('bets', []):
                                  if str(bet.get('id')) != '1' and bet.get('name') != 'Match Winner':
                                      continue
                                  values = {str(v.get('value', '')).lower(): v.get('odd') for v in bet.get('values', [])}
                                  home = values.get('home')
                                  draw = values.get('draw')
                                  away = values.get('away')
                                  if home and draw and away:
                                      found = {'1': str(home), 'X': str(draw), '2': str(away), 'bookmaker': bookmaker.get('name', '')}
                                      break
                              if found:
                                  break
                          if found:
                              break
                      if found:
                          odds[ident] = found
                  except (urllib.error.URLError, TimeoutError, RuntimeError, ValueError) as exc:
                      print('Oran sorgusu basarisiz:', ident, str(exc)[:160])
                      attempted.discard(ident)  # Sonraki calismada tekrar denensin
                      if isinstance(exc, RuntimeError):
                          break
                  time.sleep(0.12)
              write_json(scores_path, {'updated_at': stamp, 'date': today, 'response': fixtures})
              write_json(odds_path, {'updated_at': stamp, 'matches': odds})
              print('Mac:', len(fixtures), 'Oran:', len(odds))
          finally:
              write_json(progress_path, {'date': today, 'requests': daily, 'attempted': sorted(attempted), 'updated_at': stamp})
              print('Bu calismadaki API istegi:', run_calls, 'Gunluk kaydedilen:', daily)
          PY
      - name: Degisiklikleri kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json odds.json odds-progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DALYA BET football data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
