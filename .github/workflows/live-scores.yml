name: DALYA BET Canli Skorlar

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: dalya-live-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Maclari ve oranlari guncelle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os, time, urllib.error, urllib.request
          from pathlib import Path

          key = os.environ.get('API_FOOTBALL_KEY', '').strip()
          if not key:
              raise SystemExit('API_FOOTBALL_KEY GitHub secret eksik')
          base = 'https://v3.football.api-sports.io/'
          MAX_PER_RUN = 30
          MAX_PER_DAY = 120
          calls = 0
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          progress_file = Path('odds-progress.json')
          odds_file = Path('odds.json')

          def read_json(path, default):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  return data if isinstance(data, dict) else default
              except (OSError, ValueError):
                  return default

          progress = read_json(progress_file, {})
          if progress.get('date') != today:
              progress = {'date': today, 'attempted': [], 'requests': 0}
          attempted = set(map(str, progress.get('attempted', [])))
          daily_requests = max(0, int(progress.get('requests', 0)))

          def fetch(endpoint):
              global calls, daily_requests
              if calls >= MAX_PER_RUN or daily_requests >= MAX_PER_DAY:
                  raise RuntimeError('API istek limiti doldu')
              # Count even failed HTTP requests, to avoid exceeding our own cap.
              calls += 1
              daily_requests += 1
              req = urllib.request.Request(base + endpoint, headers={'x-apisports-key': key})
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.load(response)
              if payload.get('errors'):
                  raise RuntimeError(str(payload['errors']))
              return payload.get('response', [])

          # Keep already collected odds for fixtures still in today's list.
          old = read_json(odds_file, {}).get('matches', {})
          if not isinstance(old, dict):
              old = {}
          fixtures = []
          try:
              fixtures = fetch('fixtures?date=' + today)[:250]
          except (urllib.error.URLError, TimeoutError, RuntimeError) as error:
              print('Fikstur alinamadi:', error)
              raise SystemExit(1)
          ids = [str(m['fixture']['id']) for m in fixtures
                 if isinstance(m, dict) and m.get('fixture', {}).get('id') is not None]
          odds = {ident: old[ident] for ident in ids if ident in old and isinstance(old[ident], dict)}
          new_odds = 0
          for ident in ids:
              if calls >= MAX_PER_RUN or daily_requests >= MAX_PER_DAY:
                  break
              if ident in odds or ident in attempted:
                  continue
              attempted.add(ident)
              try:
                  results = fetch('odds?fixture=' + ident + '&bet=1')
                  found = None
                  for event in results:
                      for bookmaker in event.get('bookmakers', []):
                          for bet in bookmaker.get('bets', []):
                              if str(bet.get('id')) != '1':
                                  continue
                              values = {str(v.get('value', '')).lower(): v.get('odd') for v in bet.get('values', [])}
                              home = values.get('home') or values.get('1')
                              draw = values.get('draw') or values.get('x')
                              away = values.get('away') or values.get('2')
                              if home and draw and away:
                                  found = {'1': home, 'X': draw, '2': away,
                                           'bookmaker': bookmaker.get('name')}
                                  break
                          if found:
                              break
                      if found:
                          break
                  if found:
                      odds[ident] = found
                      new_odds += 1
              except (urllib.error.URLError, TimeoutError, RuntimeError) as error:
                  print('Oran sorgusu basarisiz:', ident, str(error))
                  # Retry failed requests on a later run, except when quota errors persist.
                  attempted.discard(ident)
                  if isinstance(error, RuntimeError) or isinstance(error, urllib.error.HTTPError):
                      break
              time.sleep(0.15)

          stamp = datetime.datetime.now(datetime.timezone.utc).isoformat()
          Path('scores.json').write_text(json.dumps({
              'updated_at': stamp, 'date': today, 'count': len(fixtures),
              'response': fixtures}, ensure_ascii=False, indent=2), encoding='utf-8')
          odds_file.write_text(json.dumps({
              'updated_at': stamp, 'matches': odds}, ensure_ascii=False, indent=2), encoding='utf-8')
          progress_file.write_text(json.dumps({
              'date': today, 'attempted': sorted(attempted), 'requests': daily_requests,
              'updated_at': stamp}, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Mac:', len(fixtures), 'Oran:', len(odds), 'Yeni oran:', new_odds,
                'API istek:', calls, 'Gunluk istek:', daily_requests,
                'Bugun sorgulanan:', len(attempted))
          PY
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json odds.json odds-progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DALYA BET football data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
